name: Assessment E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build React app
        run: npm run build

      - name: Verify Neon production API
        shell: bash
        run: |
          set -e
          for i in {1..8}; do
            BODY="$(curl -sS --max-time 10 https://candidateassesment.vercel.app/api/admin || true)"
            if echo "$BODY" | grep -q '"storage":"Neon PostgreSQL"'; then
              echo "$BODY"
              echo "NEON PRODUCTION API PASS"
              exit 0
            fi
            echo "Waiting for Vercel production deployment ($i/8)..."
            sleep 5
          done
          echo "Production Neon API did not become healthy."
          exit 1

      - name: Initialize encrypted assessment batch
        shell: bash
        run: |
          set -e
          for i in {1..30}; do
            BODY="$(curl -sS --max-time 8 -X POST https://candidateassesment.vercel.app/api/batch-invite-temp \
              -H 'Content-Type: application/json' \
              --data '{"action":"init","batchId":"batch_ef5dbd681b20d5d0ad7cb5df"}' || true)"
            if echo "$BODY" | grep -q '"responseVersion":2'; then
              echo "BATCH_INIT=$BODY"
              exit 0
            fi
            echo "Batch init response: $BODY"
            echo "Waiting for encrypted batch endpoint ($i/30)..."
            sleep 5
          done
          echo "Batch initialization failed."
          exit 1

      - name: Create and validate encrypted candidate invitations
        shell: bash
        run: |
          set -e
          BODY="$(curl -sS --fail-with-body --max-time 45 -X POST https://candidateassesment.vercel.app/api/batch-invite-temp \
            -H 'Content-Type: application/json' \
            --data '{"action":"run","batchId":"batch_ef5dbd681b20d5d0ad7cb5df","payload":"ענג"}')"
          echo "BATCH_RESULT=$BODY"
          echo "$BODY" | jq -e '
            .ok == true and
            (.results | length) == 9 and
            all(.results[]; .ok == true and .matches == true and .status == "invited" and (.token | startswith("sess_")))
          ' >/dev/null

      - name: Remove temporary batch key
        if: always()
        shell: bash
        run: |
          set -e
          curl -sS --fail-with-body --max-time 20 -X POST https://candidateassesment.vercel.app/api/batch-invite-temp \
            -H 'Content-Type: application/json' \
            --data '{"action":"cleanup","batchId":"batch_ef5dbd681b20d5d0ad7cb5df"}' >/dev/null
          echo "BATCH_CLEANUP=OK"
