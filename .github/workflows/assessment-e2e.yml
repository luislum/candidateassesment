name: Assessment E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build React app
        run: npm run build

      - name: Verify Neon production API
        shell: bash
        run: |
          set -e
          for i in {1..30}; do
            BODY="$(curl -sS --max-time 10 'https://candidateassesment.vercel.app/api/admin?diagnostics=1' || true)"
            if echo "$BODY" | grep -q '"diagnostics"'; then
              echo "$BODY"
              echo "NEON SCHEMA DIAGNOSTICS PASS"
              exit 0
            fi
            echo "Waiting for Vercel production deployment ($i/30)..."
            sleep 5
          done
          echo "Production Neon API did not become healthy."
          exit 1
